# site/ 폴더를 GitHub Pages(무료)로 배포합니다. 회원 개인정보(data/)는 저장소에 올리지 않습니다.
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard - no personal data in site/
        run: |
          if grep -rEh '01[016789]-?[0-9]{3,4}-?[0-9]{4}' site/ --include='*.js' --include='*.json' --include='*.html' | grep -v '0000-0000'; then
            echo "::error::site/ 안에 휴대폰 번호로 보이는 값이 있습니다. 회원 데이터는 구글 시트에만 두세요."; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
